name: Pipeline de Noticias Autonomo

concurrency:
  group: noticias-programadas
  cancel-in-progress: false

on:
  schedule:
    # 06:00, 12:00, 18:00 y 22:00 en Perú (UTC-5).
    - cron: '0 11,17,23,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar_noticias:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Clonar el Repositorio
        uses: actions/checkout@v6
        
      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium
          
      - name: Investigar y crear borradores verificados
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          NEWS_COUNTRY: PE
          NEWS_LANG: es
          MAX_NEWS_PER_REGION: '5'
          MAX_DRAFTS_PER_CATEGORY: '2'
          MAX_DRAFTS_PER_RUN: '16'
          PIPELINE_REPORT_FILE: research-report.json
          PIPELINE_DAILY_REPORT_DIR: reports/daily
        run: python main.py

      - name: Incorporar noticias publicadas mientras se investigaba
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Publicar automáticamente los borradores que pasan los controles
        env:
          SITE_URL: https://datosinfiltro-web.vercel.app
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          PIPELINE_DAILY_REPORT_DIR: reports/daily
        run: python publish_verified.py

      - name: Guardar diagnóstico de la investigación
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: investigacion-${{ github.run_id }}
          path: |
            research-report.json
            reports/daily/
          if-no-files-found: ignore
          retention-days: 14
        
      - name: Guardar artículos y sitio en GitHub
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'
          git add -A -- drafts/ published/ website/public/ reports/daily/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar noticias verificadas"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
