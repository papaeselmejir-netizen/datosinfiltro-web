name: Pipeline de Noticias Autonomo

concurrency:
  group: noticias-programadas
  cancel-in-progress: false

on:
  schedule:
    # 06:00, 12:00, 18:00 y 22:00 en Perú (UTC-5).
    - cron: '0 11,17,23,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar_noticias:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar el Repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Investigar y crear borradores verificados
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          NEWS_COUNTRY: PE
          NEWS_LANG: es
        run: python main.py

      - name: Publicar automáticamente los borradores que pasan los controles
        env:
          SITE_URL: https://datosinfiltro-web.vercel.app
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
        run: python publish_verified.py
        
      - name: Guardar artículos y sitio en GitHub
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'
          git add -A -- drafts/ published/ website/public/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar noticias verificadas"
            git push
          fi
